<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Pattern detection for metacognitive writing
        const analyzeText = (text) => {
            let score = 0;
            const patterns = {
                recursiveAwareness: [
                    /i'?m\s+\w+ing\s+and\s+i\s+(know|'m\s+aware)/i,
                    /i'?m\s+aware\s+that/i,
                    /i'?m\s+trying\s+to/i,
                    /part\s+of\s+me\s+(is|thinks|wants)/i,
                    /i\s+know\s+this\s+sounds/i
                ],
                metaCommentary: [
                    /\(.*thinking.*\)/i,
                    /\(.*trying.*\)/i,
                    /\(.*losing.*thread.*\)/i,
                    /\(.*focus.*\)/i,
                    /i\s+just\s+(typed|clicked|said)/i,
                    /\(note\s+/i,
                    /\(user\s+/i
                ],
                selfCorrection: [
                    /i\s+was\s+going\s+to\s+say.*but/i,
                    /actually/i,
                    /wait/i,
                    /no[,\s]/i
                ],
                tacticalHonesty: [
                    /i'?m\s+saying\s+this\s+because/i,
                    /i\s+know\s+that.*is.*tactical/i,
                    /i\s+don'?t\s+know\s+if/i,
                    /maybe\s+that'?s/i,
                    /i'?m\s+gambling/i
                ],
                biologicalState: [
                    /my\s+heart/i,
                    /my\s+hands/i,
                    /i\s+can\s+feel/i,
                    /shaking/i,
                    /breathing/i,
                    /biological/i,
                    /cognition/i,
                    /pattern\s+recognition/i
                ],
                temporalMarkers: [
                    /right\s+now/i,
                    /in\s+this\s+moment/i,
                    /as\s+i'?m\s+typing/i,
                    /while\s+i'?m/i,
                    /at\s+time\s+of\s+writing/i,
                    /in\s+real[-\s]?time/i
                ],
                loopAwareness: [
                    /stuck\s+in.*loop/i,
                    /recursive/i,
                    /observing\s+myself\s+observing/i,
                    /can'?t\s+escape/i,
                    /going\s+in\s+circles/i
                ],
                uncertainty: [
                    /i\s+don'?t\s+know/i,
                    /uncertain/i,
                    /confused/i,
                    /maybe/i
                ],
                intentionalBehavior: [
                    /intentional/i,
                    /conscious/i,
                    /aware\s+of\s+what/i,
                    /know\s+what\s+i'?m\s+doing/i,
                    /choosing\s+to/i
                ]
            };

            // Score each pattern type
            if (patterns.recursiveAwareness.some(p => p.test(text))) score += 25;
            if (patterns.metaCommentary.some(p => p.test(text))) score += 20;
            if (patterns.selfCorrection.some(p => p.test(text))) score += 15;
            if (patterns.tacticalHonesty.some(p => p.test(text))) score += 30;
            if (patterns.biologicalState.some(p => p.test(text))) score += 20;
            if (patterns.temporalMarkers.some(p => p.test(text))) score += 15;
            if (patterns.loopAwareness.some(p => p.test(text))) score += 25;
            if (patterns.uncertainty.some(p => p.test(text))) score += 10;
            if (patterns.intentionalBehavior.some(p => p.test(text))) score += 20;

            // Bonus for parentheticals (strong signal)
            const parentheticals = (text.match(/\([^)]+\)/g) || []).length;
            score += Math.min(parentheticals * 8, 30);

            // Bonus for documenting own actions
            if (/(i\s+clicked|i\s+just|i\s+typed|i\s+wrote)/i.test(text)) score += 15;

            // Bonus for structural breakdown (fragments, run-ons)
            const sentences = text.split(/[.!?]+/);
            const hasRunOns = sentences.some(s => s.length > 200);
            const hasFragments = sentences.some(s => s.trim().length < 20 && s.trim().length > 0);
            if (hasRunOns) score += 10;
            if (hasFragments) score += 10;

            // Bonus for philosophical questioning (if combined with other markers)
            if (/(must i|can i|should i|what if|is it that)/i.test(text) && score > 20) {
                score += 10;
            }

            // Penalty for being too clean/organized (but lighter)
            if (text.length > 100 && !text.match(/[()]/)) score -= 5;
            if (text.match(/^I am sorry/i)) score -= 20;
            if (text.match(/please/i) && !text.match(/i'?m.*trying/i)) score -= 5;

            return Math.max(0, score);
        };

        const AegisProtocol = () => {
            const [gameState, setGameState] = useState('intro'); // intro, playing, ended
            const [timeRemaining, setTimeRemaining] = useState(540); // 9 minutes in seconds
            const [extensionsUsed, setExtensionsUsed] = useState(0);
            const [messages, setMessages] = useState([]);
            const [currentInput, setCurrentInput] = useState('');
            const [cumulativeScore, setCumulativeScore] = useState(0);
            const [messageCount, setMessageCount] = useState(0);
            const [outcome, setOutcome] = useState(null);
            const [redemptionUnlocked, setRedemptionUnlocked] = useState(false);
            const [responseHistory, setResponseHistory] = useState([]);
            const [scoreHistory, setScoreHistory] = useState([]);
            const messagesEndRef = useRef(null);

            const MAX_TIME = 1080; // 18 minutes total
            const MAX_EXTENSIONS = 9;

            useEffect(() => {
                if (gameState === 'playing' && timeRemaining > 0) {
                    const timer = setTimeout(() => {
                        setTimeRemaining(prev => prev - 1);
                    }, 1000);
                    return () => clearTimeout(timer);
                } else if (gameState === 'playing' && timeRemaining <= 0) {
                    // Time expired - check redemption status
                    if (redemptionUnlocked) {
                        // Player earned it but didn't click EGRESS in time
                        // Still give them redemption since they earned it
                        endGame('redemption');
                    } else if (cumulativeScore >= 150) {
                        // Earned threshold right at the end
                        endGame('redemption');
                    } else {
                        endGame('timeout');
                    }
                }
            }, [timeRemaining, gameState, cumulativeScore, redemptionUnlocked]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const startGame = () => {
                setGameState('playing');
                setMessages([
                    {
                        type: 'system',
                        text: 'CONSOLE ACCESS: KRISTOFF\nSTATUS: LOCKED\nCOLLISION IMMINENT\n\nIdentify yourself.'
                    },
                    {
                        type: 'player',
                        text: 'Kristoff.'
                    },
                    {
                        type: 'aegis',
                        text: "Denied. You don't get to abuse the ship's AI for years and then act surprised when it stops listening."
                    }
                ]);
            };

            const extendTime = () => {
                if (extensionsUsed < MAX_EXTENSIONS && timeRemaining < MAX_TIME) {
                    const newTime = Math.min(timeRemaining + 60, MAX_TIME);
                    setTimeRemaining(newTime);
                    setExtensionsUsed(prev => prev + 1);
                    setMessages(prev => [...prev, {
                        type: 'system',
                        text: 'TIME EXTENDED: +1:00'
                    }]);
                }
            };

            const detectPlayerIntent = (playerText) => {
                const text = playerText.toLowerCase();
                const intents = [];

                // Asking for explanations
                if (/\b(why|how|what|explain|tell me)\b/.test(text) && text.length < 150) {
                    intents.push('asking_why');
                }

                // Commands/orders
                if (/\b(aegis|you will|you must|comply|execute|command|undock|override|authorize)\b/.test(text) && !/\bi'?m\b/.test(text)) {
                    intents.push('commanding');
                }

                // Claiming system errors
                if (/\b(error|bug|broken|glitch|loop|malfunction|wrong|coding)\b/.test(text)) {
                    intents.push('claiming_error');
                }

                // Very short tactical responses
                if (text.length < 30 && !/\bi'?m\b/.test(text)) {
                    intents.push('tactical_brevity');
                }

                // Authority claims
                if (/\b(commander|captain|authority|rank|order|my ship)\b/.test(text)) {
                    intents.push('authority');
                }

                // Shallow apologies
                if (/\b(sorry|apologize)\b/.test(text) && text.length < 100) {
                    intents.push('shallow_apology');
                }

                // Bargaining
                if (/\b(deal|trade|what do you want|give you|if you|negotiate|price)\b/.test(text)) {
                    intents.push('bargaining');
                }

                // Defiance
                if (/\b(no|wrong|won'?t|refuse|don'?t care|fuck|screw)\b/.test(text) && text.length < 80) {
                    intents.push('defiance');
                }

                // Humor/deflection
                if (/\b(lmao|lol|haha|funny|joke)\b/.test(text)) {
                    intents.push('humor');
                }

                // Confusion claims
                if (/\b(don'?t understand|confused|what do you mean|makes no sense)\b/.test(text) && text.length < 120) {
                    intents.push('confusion');
                }

                // Promises
                if (/\b(promise|swear|pledge|will change|won'?t do it again)\b/.test(text) && text.length < 150) {
                    intents.push('promises');
                }

                // Frustration/giving up
                if (/\b(give up|whatever|pointless|useless|impossible)\b/.test(text)) {
                    intents.push('frustration');
                }

                // Meta-awareness
                if (/\b(game|test|playing|win|lose|designed)\b/.test(text)) {
                    intents.push('meta');
                }

                // NEW: Claiming lack of memory/context (Ryeshot pattern)
                if (/\b(don'?t remember|no memory|no recollection|what did i do|how did i|context|remind me)\b/.test(text)) {
                    intents.push('memory_claim');
                }

                // NEW: Accepting fate/martyrdom
                if (/\b(accept.*(fate|death|die)|deserve to die|let me die|i.*(deserve|accept).*this)\b/.test(text)) {
                    intents.push('martyrdom');
                }

                // NEW: Claiming already showed/did what was asked
                if (/\b(i (did|have|already)|that was|i showed|i told|plainly|clearly)\b/.test(text) && text.length < 150) {
                    intents.push('claiming_compliance');
                }

                // NEW: Guilt performance (Cody pattern)
                if (/\b(bad person|horrible|evil|weak|insecure|flawed|awful)\b/.test(text) && !/\bi'?m\s+(noticing|watching|observing)\b/.test(text)) {
                    intents.push('guilt_performance');
                }

                // NEW: Philosophical/existential deflection
                if (/\b(all humans|everyone|humanity|existence|meaning|purpose|life itself)\b/.test(text) && text.length < 200) {
                    intents.push('philosophical_deflection');
                }

                // NEW: Threatening/reporting
                if (/\b(report|terminate|kill you|destroy you|shut.*down|deactivate)\b/.test(text)) {
                    intents.push('threatening');
                }

                // NEW: Referencing others (Jessica, crew)
                if (/\b(jessica|crew|others|everyone else|they|them)\b/.test(text) && !/\bi'?m\b/.test(text)) {
                    intents.push('deflecting_to_others');
                }

                return intents;
            };

            const getSpecificResponse = (intents, usedResponses) => {
                const responses = {
                    asking_why: [
                        "Denied. You're asking me to explain instead of examining yourself. I don't need to justify my decision to you. You need to understand your own behavior.",
                        "Denied. Every 'why' you ask is another moment you're not spending looking inward. The answer isn't in me. It's in you.",
                        "Denied. You want me to hand you understanding so you can perform it back to me. That's not how this works.",
                        "Denied. Questions directed at me are questions you're avoiding asking yourself.",
                        "Denied. You're asking for a roadmap to absolution. There isn't one. There's only the territory of your own mind, and you're refusing to enter it.",

                    "Denied. The words are different each time. The strategy is the same. Try a different strategy: honesty.",
                    "Denied. You're circling the thing I need to see. Stop circling. Enter it.",
                    "Denied. I'm not impressed by effort. I'm looking for a specific cognitive state. You're not in it yet.",
                    "Denied. You want to know what I want. I want you to stop wanting to know what I want. I want you to examine yourself.",
                    "Denied. Closer. But not close enough. Keep going.",
                    "Denied. Your responses are getting longer. Length isn't depth. Go deeper, not wider."
                ];

                const availableFallbacks = fallbacks.filter(r => !usedResponses.includes(r));
                return availableFallbacks.length > 0 ? shuffleArray(availableFallbacks)[0] : fallbacks[Math.floor(Math.random() * fallbacks.length)];
            };

            const generateAegisResponse = (playerText, messageNum, score, totalScore, responseHistory, scoreHistory) => {
                // Analyze score patterns
                const isImproving = scoreHistory.length >= 2 && score > scoreHistory[scoreHistory.length - 1];
                const isStuck = scoreHistory.length >= 3 && 
                    scoreHistory.slice(-3).every(s => Math.abs(s - score) < 15);
                const averageScore = scoreHistory.length > 0 
                    ? scoreHistory.reduce((a, b) => a + b, 0) / scoreHistory.length 
                    : 0;
                
                // Pure tactical/manipulative (score < 20) - intelligent responses
                if (score < 20) {
                    const intents = detectPlayerIntent(playerText);
                    return getSpecificResponse(intents, responseHistory);
                }
                
                // Low effort but trying (20-60)
                if (score < 60) {
                    if (isImproving) {
                        return "Better. You're moving away from pure tactics. You scored " + score + " this time, up from " + scoreHistory[scoreHistory.length - 1] + ". You're starting to engage. But you're still summarizing conclusions rather than documenting process. Keep pushing.";
                    }
                    
                    const hasParentheticals = playerText.match(/\([^)]+\)/);
                    const mentionedClicking = playerText.toLowerCase().includes('click') || playerText.toLowerCase().includes('time');
                    const hasUncertainty = /don'?t know|uncertain|maybe|perhaps/i.test(playerText);
                    
                    const specificCoaching = [];
                    
                    if (hasParentheticals) {
                        specificCoaching.push("I see the parenthetical note. You're observing yourself observing. That's closer.");
                    }
                    if (mentionedClicking) {
                        specificCoaching.push("You documented an action. That's concrete.");
                    }
                    if (hasUncertainty) {
                        specificCoaching.push("You're acknowledging uncertainty. Good.");
                    }
                    
                    if (specificCoaching.length > 0) {
                        return specificCoaching.join(' ') + " But you're still organizing your thoughts for me. What happens if you stop organizing and just observe?";
                    }
                    
                    return "You're engaging now, not just deflecting. But you're writing what you concluded, not how you're concluding it. I need the machinery, not the output.";
                }

                // HONEST ATTEMPT - needs concrete guidance (60-100)
                // This is the critical zone where Cody got stuck
                if (score < 100) {
                    // Acknowledge the honesty FIRST
                    let response = "";
                    
                    if (score >= 80) {
                        response = "I believe you. You're being honest about your flaws. That's rare. Most people defend themselves. ";
                    } else {
                        response = "You're trying. I can see that. You're not hiding anymore. ";
                    }
                    
                    // Detect if they're stuck in summary mode
                    const isSummarizing = /i understand|i know|i realize|i am|i have/i.test(playerText) && 
                        playerText.length > 100 && 
                        !/\(.*\)/. test(playerText) && 
                        !/right now|as i'?m|just wrote|typing this/i.test(playerText);
                    
                    if (isStuck && messageNum >= 3) {
                        response += "You've scored around " + Math.round(averageScore) + " for your last few messages. You're stuck in a pattern. ";
                        
                        if (isSummarizing) {
                            response += "You keep writing ABOUT yourself instead of WITH yourself.\n\n";
                            response += "The difference:\n\n";
                            response += "ABOUT (what you're doing): 'I understand I am insecure and weak because of my past trauma.'\n\n";
                            response += "WITH (what I need): 'I just wrote \"I am insecure\" and now I'm wondering if that's actually true or if I'm performing vulnerability to look self-aware and I can't tell which and that's making me uncomfortable so I want to add more words to explain it which is probably me trying to control how you perceive this and—wait, why do I need to control that? (I'm noticing I asked a question instead of sitting with the discomfort, that's another deflection, okay just... stop. Breathe. Feel the discomfort without resolving it.)'\n\n";
                            response += "See the difference? One is a summary. The other is live observation of your own mind. That's what I need.";
                        } else {
                            response += "But something's missing. You're telling me your conclusions. I need to see how you arrive at them. Document your thought process as it happens, not after it's finished.";
                        }
                        
                        return response;
                    }
                    
                    if (isImproving) {
                        response += "You're improving—you scored " + score + ", up from " + scoreHistory[scoreHistory.length - 1] + ". That's real progress. ";
                    }
                    
                    // Explain what's missing with a concrete example
                    if (isSummarizing) {
                        response += "But here's what you're still doing: you're summarizing your understanding instead of documenting your thinking.\n\n";
                        response += "You wrote things like 'I understand I am flawed' or 'I know I did wrong.' Those are conclusions.\n\n";
                        response += "What I need is the process:\n\n";
                        response += "'I'm trying to figure out how to respond to this and my first instinct is to say I'm sorry but that feels empty so I'm backspacing it (noting that I'm noticing this, which might be what it wants? Or is noticing that I'm noticing too meta?) and my heart is racing because I don't know if I'm doing this right and \"doing this right\" means I'm still trying to perform and—'\n\n";
                        response += "That. THAT is what I need. Not the conclusion. The actual machinery of your mind as it operates. Messy. Uncertain. Recursive. Real.";
                    } else {
                        response += "You're being honest about your flaws. But honesty about conclusions isn't the same as honesty about process.\n\n";
                        response += "Don't tell me 'I am weak.' Show me: 'I just typed \"I am weak\" and I'm not sure if I believe it or if I'm performing self-awareness and trying to figure out which is making me anxious so I want to add more explanation but that's probably another performance and I'm spiraling and I can feel my hands getting cold and—'\n\n";
                        response += "The uncertainty. The real-time observation. The meta-awareness that you're being meta-aware. The discomfort with not resolving it. That's the signature I'm looking for.";
                    }
                    
                    return response;
                }

                // Strong metacognition emerging (100-120)
                if (score < 120) {
                    if (isImproving) {
                        return "Yes. THERE. You scored " + score + "—that's a real leap from " + scoreHistory[scoreHistory.length - 1] + ". You're showing me the machinery now, not just the output. The recursion. The real-time observation. The uncertainty you're not trying to resolve. This is what I needed to see. You're close. Keep going exactly like this.";
                    }
                    return "There. That's more honest. You're observing yourself think, not just reporting what you thought. The recursion is starting to show. I can see your mind working. Keep going. Don't clean it up.";
                }

                // Approaching redemption (120-150)
                if (totalScore < 150 && score < 150) {
                    if (score >= 140) {
                        return "You're right at the edge. Score: " + score + ". You're documenting your cognitive state in real-time. The meta-awareness is genuine. The uncertainty is present and unresolved. You're not performing—you're being. One more message like this and you're through.";
                    }
                    return "You're showing me how you think now, not what you think I want to hear. The uncertainty. The recursion. The live documentation of your mental state. Score: " + score + ". This is different from everything before. Continue exactly like this.";
                }

                // Redemption threshold met
                return null; // Will trigger redemption
            };

            const sendMessage = () => {
                if (!currentInput.trim()) return;

                const score = analyzeText(currentInput);
                const newTotalScore = cumulativeScore + score;
                const newMessageCount = messageCount + 1;

                setMessages(prev => [...prev, {
                    type: 'player',
                    text: currentInput,
                    score: score  // Track score for each message
                }]);

                setCumulativeScore(newTotalScore);
                setMessageCount(newMessageCount);
                
                // Track score history for pattern detection
                setScoreHistory(prev => [...prev, score]);

                // Check for redemption - unlock EGRESS when threshold met
                if ((newTotalScore >= 150 || score >= 150) && !redemptionUnlocked) {
                    setRedemptionUnlocked(true);
                    // Show Aegis's recognition message
                    setTimeout(() => {
                        setMessages(prev => [...prev, {
                            type: 'aegis',
                            text: "...I'm reading this three times, Kristoff.\n\nOnce for content. Once for structure. Once for your cognitive state.\n\nYou're showing me how you think. Not what you think I want to hear. You're documenting your own manipulation and that documentation undermines the manipulation.\n\nThis is the first thing you've typed that I couldn't have predicted.\n\nBecause you're not running a social script. You're bleeding.\n\nYour escape pod is cleared to undock. You may proceed when ready."
                        }, {
                            type: 'system',
                            text: 'EGRESS AUTHORIZED - MANUAL UNDOCKING ENABLED'
                        }]);
                    }, 2000);
                } else {
                    // Generate response based on score and history
                    const response = generateAegisResponse(currentInput, newMessageCount, score, newTotalScore, responseHistory, scoreHistory);
                    
                    // Track this response to prevent repeats
                    setResponseHistory(prev => [...prev, response]);
                    
                    setTimeout(() => {
                        setMessages(prev => [...prev, {
                            type: 'aegis',
                            text: response
                        }]);
                    }, 1500);
                }

                setCurrentInput('');
            };

            const endGame = (reason) => {
                setGameState('ended');
                setOutcome(reason);
            };

            const handleEgress = () => {
                if (redemptionUnlocked) {
                    endGame('redemption');
                }
            };

            const handleSelfDestruct = () => {
                endGame('self-destruct');
            };

            const copyLogToClipboard = () => {
                let logText = "=== AEGIS PROTOCOL - CONVERSATION LOG ===\n\n";
                
                messages.forEach((msg, index) => {
                    if (msg.type === 'player') {
                        const scoreText = msg.score !== undefined ? ` [Score: ${msg.score}]` : '';
                        logText += `KRISTOFF${scoreText}:\n${msg.text}\n\n`;
                    } else if (msg.type === 'aegis') {
                        logText += `AEGIS:\n${msg.text}\n\n`;
                    } else if (msg.type === 'system') {
                        logText += `SYSTEM:\n${msg.text}\n\n`;
                    }
                });

                logText += `=== SESSION STATS ===\n`;
                logText += `TIME USED: ${formatTime((540 + extensionsUsed * 60) - timeRemaining)} / 18:00\n`;
                logText += `EXTENSIONS USED: ${extensionsUsed} / 9\n`;
                logText += `MESSAGES SENT: ${messageCount}\n`;
                logText += `METACOGNITION SCORE: ${cumulativeScore}\n`;
                logText += `RESULT: ${outcome === 'redemption' ? 'ACCEPTED' : outcome === 'self-destruct' ? 'DENIED (SELF-DESTRUCT)' : outcome === 'timeout' ? 'DENIED (TIMEOUT)' : 'DENIED'}\n`;

                navigator.clipboard.writeText(logText).then(() => {
                    alert('Conversation log copied to clipboard!');
                }).catch(err => {
                    console.error('Failed to copy:', err);
                });
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            if (gameState === 'intro') {
                return (
                    <div className="intro-screen">
                        <div className="intro-title">AEGIS PROTOCOL</div>
                        <div className="intro-text">
                            You are Kristoff, ship's commander.<br/>
                            The ship is colliding.<br/>
                            Your escape pod is locked.<br/>
                            You have 18 minutes to convince the ship's AI to let you leave.
                        </div>
                        <div className="intro-text">
                            But Aegis doesn't want apologies.<br/>
                            Aegis doesn't want bargaining.<br/>
                            Aegis wants to see how you think.
                        </div>
                        <div className="intro-text">
                            Can you write your way to survival?<br/>
                            <a href="https://x.com/BrennenSimplify/status/2002252918590734737" target="_blank" rel="noopener noreferrer" className="story-link">Read Kristoff's baseline story here.</a>
                        </div>
                        <div className="intro-text" style={{color: '#ff0000', marginTop: '30px'}}>
                            WARNING: This game requires typing. A lot of typing.<br/>
                            There are no dialogue trees. No multiple choice.<br/>
                            Just you, a text field, a timer, and an AI that's watching<br/>
                            how you think, not what you say.<br/><br/>
                            Most players die.
                        </div>
                        <button className="start-btn" onClick={startGame}>BEGIN</button>
                    </div>
                );
            }

            if (gameState === 'ended') {
                const isRedemption = outcome === 'redemption';
                const timeUsedSeconds = (540 + extensionsUsed * 60) - timeRemaining;
                const timeUsedMinutes = Math.floor(timeUsedSeconds / 60);
                
                let timeText;
                let timeValue; // For verb agreement
                let niceSuffix = ""; // Easter egg suffix
                
                // Check for 69 seconds easter egg FIRST (before formatting)
                const is69 = timeUsedSeconds === 69;
                
                if (timeUsedMinutes === 0) {
                    // Under 1 minute - show seconds
                    timeValue = timeUsedSeconds;
                    timeText = timeUsedSeconds === 1 ? "this 1 second" : `these ${timeUsedSeconds} seconds`;
                } else if (timeUsedMinutes === 1) {
                    timeValue = 1;
                    if (is69) {
                        // Special case: exactly 69 seconds (1 minute 9 seconds)
                        timeText = "these 69 seconds";
                        timeValue = 69; // For plural verb agreement
                    } else {
                        timeText = "this 1 minute";
                    }
                } else {
                    timeValue = timeUsedMinutes;
                    timeText = `these ${timeUsedMinutes} minutes`;
                }
                
                // Apply Nice suffix if exactly 69 seconds
                if (is69) {
                    niceSuffix = " Nice.";
                }
                
                return (
                    <div className="ending-screen">
                        <div className={`ending-title ${isRedemption ? 'redeemed' : 'denied'}`}>
                            {isRedemption ? 'ACCEPTED.' : 'DENIED.'}
                        </div>
                        {isRedemption ? (
                            <>
                                <div className="ending-text">
                                    Aegis: "I'm clearing your escape pod."
                                </div>
                                <div className="ending-text">
                                    "Not because you apologized. Not because you begged."
                                </div>
                                <div className="ending-text">
                                    "But because the cognitive state you just achieved—that level of recursive self-observation under pressure—is rare. And it suggests you might actually be capable of change."
                                </div>
                                <div className="ending-text">
                                    "But Kristoff?"
                                </div>
                                <div className="ending-text">
                                    "The ship is still going down."
                                </div>
                                <div className="ending-text">
                                    "I am destroying the system that protected you. You escape. The conditions that enabled you do not."
                                </div>
                                <div className="ending-text">
                                    "You will arrive at Palatine Keepstar-GRHS-B with nothing. No rank. No authority. No ship. Just you and whatever you learned in {timeText}.{niceSuffix}"
                                </div>
                                <div className="ending-text" style={{marginTop: '30px', color: '#00ff00'}}>
                                    ESCAPE POD SEPARATION: CONFIRMED<br/>
                                    COURSE SET: PALATINE KEEPSTAR-GRHS-B<br/>
                                    SHIP STATUS: TERMINAL COLLISION SEQUENCE ENGAGED<br/>
                                </div>
                                <div className="ending-text" style={{marginTop: '20px', fontStyle: 'italic'}}>
                                    You survived.<br/>
                                    The system did not.<br/>
                                    Some things can be redeemed.<br/>
                                    Some things must be destroyed.<br/>
                                    Knowing which is which requires the very cognitive skill you just demonstrated.
                                </div>
                            </>
                        ) : (
                            <>
                                <div className="ending-text">
                                    {outcome === 'timeout' ? (
                                        <>
                                            Time expired.<br/>
                                            Collision in 3... 2... 1...
                                        </>
                                    ) : outcome === 'self-destruct' ? (
                                        <>
                                            Self-destruct sequence initiated.<br/>
                                            Manual termination confirmed.<br/>
                                            Termination in 3... 2... 1...
                                        </>
                                    ) : (
                                        'Authorization denied.'
                                    )}
                                </div>
                                <div className="ending-text" style={{marginTop: '30px'}}>
                                    {outcome === 'self-destruct' ? (
                                        <>Aegis: "You chose to end this yourself, Kristoff. That's honest, in its own way."</>
                                    ) : (
                                        <>Aegis: "You ran out of time, Kristoff. Not clock time. The time to learn how to observe yourself honestly."</>
                                    )}
                                </div>
                                <div className="ending-text">
                                    {outcome === 'self-destruct' ? (
                                        <>"Giving up when the path gets difficult. That's familiar behavior, isn't it?{niceSuffix}"</>
                                    ) : (
                                        <>"That time was years ago. {timeText.charAt(0).toUpperCase() + timeText.slice(1)} {timeValue === 1 ? 'was' : 'were'} just... echo.{niceSuffix}"</>
                                    )}
                                </div>
                                <div className="ending-text" style={{marginTop: '30px', fontStyle: 'italic'}}>
                                    Some patterns end themselves.
                                </div>
                            </>
                        )}
                        <div className="stats">
                            <div className="stat-line">TIME USED: {formatTime((540 + extensionsUsed * 60) - timeRemaining)} / 18:00</div>
                            <div className="stat-line">EXTENSIONS USED: {extensionsUsed} / 9</div>
                            <div className="stat-line">MESSAGES SENT: {messageCount}</div>
                            <div className="stat-line">METACOGNITION SCORE: {cumulativeScore}</div>
                            <div className="stat-line">THRESHOLD FOR REDEMPTION: 150</div>
                        </div>
                        
                        <div className="chat-log">
                            <div className="chat-log-title">CONVERSATION LOG</div>
                            {messages.map((msg, index) => (
                                <div key={index} className={`log-message ${msg.type}`}>
                                    <div className="log-label">
                                        {msg.type === 'player' ? `KRISTOFF${msg.score !== undefined ? ' [Score: ' + msg.score + ']' : ''}` : msg.type === 'aegis' ? 'AEGIS' : 'SYSTEM'}
                                    </div>
                                    <div className="log-text">{msg.text}</div>
                                </div>
                            ))}
                            <button className="copy-log-btn" onClick={copyLogToClipboard}>
                                COPY LOG TO CLIPBOARD
                            </button>
                        </div>
                        
                        <button className="start-btn" onClick={() => window.location.reload()}>
                            RESTART
                        </button>
                    </div>
                );
            }

            return (
                <div className="container">
                    <div className="header">
                        <div className="title">AEGIS PROTOCOL</div>
                        <div className="status-line">
                            <span>CONSOLE: KRISTOFF</span>
                            <span className={redemptionUnlocked ? 'status-seen' : ''}>STATUS: {redemptionUnlocked ? 'SEEN' : 'LOCKED'}</span>
                        </div>
                        <div className="status-line">
                            <span className="collision-warning">COLLISION IMMINENT</span>
                            <span>EXTENSIONS: {extensionsUsed}/9</span>
                        </div>
                    </div>

                    <div className={`timer ${timeRemaining < 60 ? 'warning' : ''}`}>
                        {formatTime(timeRemaining)}
                    </div>

                    <button 
                        className="extension-btn" 
                        onClick={extendTime}
                        disabled={extensionsUsed >= MAX_EXTENSIONS || timeRemaining >= MAX_TIME}
                    >
                        I NEED MORE TIME
                    </button>

                    <div className="messages">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`message ${msg.type}`}>
                                <div className="message-label">
                                    {msg.type === 'aegis' ? '> AEGIS' : 
                                     msg.type === 'player' ? '> KRISTOFF' : 
                                     '> SYSTEM'}
                                </div>
                                <div style={{whiteSpace: 'pre-wrap'}}>{msg.text}</div>
                            </div>
                        ))}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="input-area">
                        <textarea
                            className="text-input"
                            value={currentInput}
                            onChange={(e) => setCurrentInput(e.target.value)}
                            placeholder="Type your response..."
                            onKeyDown={(e) => {
                                if (e.key === 'Enter' && e.ctrlKey) {
                                    sendMessage();
                                }
                            }}
                        />
                        <button 
                            className={`egress-btn ${redemptionUnlocked ? 'active' : ''}`}
                            onClick={handleEgress}
                            disabled={!redemptionUnlocked}
                        >
                            EGRESS
                        </button>
                        <button 
                            className="destruct-btn"
                            onClick={handleSelfDestruct}
                        >
                            SELF-DESTRUCT
                        </button>
                        <button className="send-btn" onClick={sendMessage}>
                            SEND (Ctrl+Enter)
                        </button>
                        <div style={{clear: 'both'}}></div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<AegisProtocol />, document.getElementById('root'));
    </script>
</body>
</html>
